; Xiaodou desktop companion firmware
; Host tests do not need a board: pio test -e native

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.flash_size = 8MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    fastled/FastLED@^3.6.0
    adafruit/Adafruit VL53L0X@^1.2.4
test_filter = test_protocol

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
