[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotd"
version = "0.1.0"
description = "Host-side teleop and safety supervisor for the wheel-rover blueprint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["robotd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
