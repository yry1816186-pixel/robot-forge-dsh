name: Feature request
description: 新形态、新蓝本、新检查规则、新工具
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请说明“谁在什么场景下遇到什么问题”，而不是只给一个方案。能落地的蓝本/规则优先。
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 新形态配方
        - 新蓝本
        - 新检查/设计规则
        - 新工具或 CLI
        - 文档/评测/工程化
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前会发生什么，为什么不够好
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 输入/输出、涉及文件、如何判定成功
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
  - type: textarea
    id: safety
    attributes:
      label: 安全影响
      description: 是否涉及电池/市电/运动/激光/隐私/联网/儿童/户外/医疗
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 issue
          required: true
        - label: 这不是安全漏洞（安全漏洞走私密渠道）
          required: true
