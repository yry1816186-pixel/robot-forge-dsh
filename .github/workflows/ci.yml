name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / node${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Validate bundle
        run: python scripts/validate_plugin.py

      - name: Python engine tests
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Host tool tests
        run: node --test tests/plugin.test.mjs

      - name: Blueprint selftest
        run: python skills/robot-forge/scripts/forge.py selftest

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}
          path: |
            **/*.log
          if-no-files-found: ignore
          retention-days: 7
